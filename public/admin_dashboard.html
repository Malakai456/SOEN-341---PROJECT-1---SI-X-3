<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Moderation Dashboard</title>
    <link rel="stylesheet" href="public/styles.css">
</head>
<body>
<header>
    <h2 class="logo"></h2>
    <h2 class="companyname">
        <a href="mainpage.html" style="color: inherit; text-decoration: none;">CampusEvents</a>
    </h2>
    <nav class="navigation">
        <a href="events.html">Events</a>
        <a href="calendar.html">Calendar</a>
        <a href="admin_dashboard.html" class="loginbutton">Admin</a>
    </nav>
</header>

<main class="admin-dashboard">
    <section class="admin-dashboard__header">
        <h1>Flagged Events</h1>
        <p>Review community-reported events and resolve them to keep the marketplace safe.</p>
    </section>

    <div class="admin-feedback" data-status-message hidden></div>
    <div class="admin-empty" data-empty-state hidden>No flagged events require attention right now.</div>

    <div class="admin-table-wrapper" data-table-wrapper hidden>
        <table class="admin-flagged-table" data-flagged-events>
            <thead>
                <tr>
                    <th scope="col">Event</th>
                    <th scope="col">Schedule</th>
                    <th scope="col">Details</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</main>

<script src="admin_dashboard.js"></script>
<footer class="site-footer">
    <p>
      © CampusEvents2025 · 
      <a href="about.html">About</a> · 
      <a href="contactfoot.html">Contact</a> · 
      <a href="privacy.html">Privacy</a>
    </p>
</footer>
</body>
</html>
