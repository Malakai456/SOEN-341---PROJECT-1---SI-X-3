<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Event</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .datetime-group {
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }

    .datetime-group .input-text {
      flex: 1;
    }

    textarea[name="description"] {
      width: 100%;
      height: 50px; /* same height as inputs */
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      resize: none;
    }

    #priceField {
      display: none;
    }
  </style>
</head>
<body>
<header>
  <h2 class="companyname"><a href="mainpage.html" style="color: inherit; text-decoration: none;">CampusEvents</a></h2>
  <nav class="navigation">
    <a href="mainpage.html">Home</a>
    <a href="create_events.html" class="loginbutton">Create Event</a>
    <a href="logout.html">Logout</a>
  </nav>
</header>

<div class="registerpage">
  <h1>Create a New Event</h1>
  <form id="createEventForm">
    <div class="input-text">
      <input type="text" name="title" placeholder="Event Title" required>
    </div>

    <div class="input-text">
      <textarea name="description" placeholder="Event Description" required></textarea>
    </div>

    <div class="datetime-group">
      <div class="input-text">
        <label>Date</label>
        <input type="date" name="event_date" required>
      </div>
      <div class="input-text">
        <label>Time</label>
        <input type="time" name="event_time" required>
      </div>
    </div>

    <div class="input-text">
      <input type="text" name="location_name" placeholder="Location Name" required>
    </div>

    <div class="input-text">
      <input type="number" name="capacity" placeholder="Ticket Capacity" min="1" required>
    </div>

    <div class="input-text">
      <label>Ticket Type</label>
      <select name="ticket_policy" id="ticketType" required>
        <option value="free">Free</option>
        <option value="paid">Paid</option>
      </select>
    </div>

    <div class="input-text" id="priceField">
      <input type="number" name="price" placeholder="Enter Ticket Price ($)" min="1">
    </div>

    <button type="submit">Create Event</button>
  </form>
  <p id="message"></p>
</div>

<!--Link to external JS file -->
<script src="create_events.js"></script>
</body>
</html>
