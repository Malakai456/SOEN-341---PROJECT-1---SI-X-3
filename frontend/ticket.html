<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Your Ticket</title>
  <link rel="stylesheet" href="/styles.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script defer src="/ticket.js"></script>
</head>


 <style>
    .ticket-card {
      width: 90%;
      max-width: 900px;
      margin-top: 40px;
    background: white;
    color: black; 
    align-items: center;
      justify-self: anchor-center;  
      padding: 30px;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    h1, h2 {
      margin: 0;
      font-weight: 600;
    }

    .event-info {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

.thanks{
  color: white;
}

    .details {
      color:black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      font-size: 16px;
    }

    

    hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.25);
      margin: 15px 0;
    }

    #qrcode {
      width: 256px;
      height: 256px;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 10px;
    }

    a {
      color: #85d7ff;
    }
  </style>
</head>

<body>
<header>
  <h2 class="companyname">
    <a href="mainpage.html" style="color: inherit; text-decoration: none;">CampusEvents</a>
  </h2>
    <nav class="navigation">
    <a href="mainpage.html">Home</a>
    <a href="contact.html">Contact</a>
    <a href="calendar.html">My Calendar</a>
    <a href="my_purchases.html">My Purchases</a>
    <a href="register.html" class="signInButton">Sign Up</a>
    <a href="login.html" class="loginbutton">Log In</a>
  </nav>
</header>

  <main class="ticket-card">

    <h1 id="thanks"></h1>

    <section class="event-info">
      <img id="eventImage" style = "display:none";/>

      <div class="details">
        <p><strong>Name:</strong> <span id="fullName"></span></p>
        <p><strong>Event:</strong> <span id="eventName"></span></p>
        <p><strong>Date:</strong> <span id="eventDate"></span></p>
        <p><strong>Time:</strong> <span id="eventTime"></span></p>
        <p><strong>Location:</strong> <span id="eventLocation"></span></p>
        <p><strong>Price:</strong> $<span id="eventPrice"></span></p>
        <p><strong>Ticket ID:</strong> <span id="ticketId"></span></p>
      </div>
    </section>
<button id="downloadBtn" class="download-btn">Download Ticket</button>

    <hr>
    <h2>Show This Code at the Entrance</h2>
    <div id="qrcode"></div>
  </main>
<script>
document.getElementById("downloadBtn").addEventListener("click", function () {
    const ticket = document.querySelector(".ticket-card");

    html2canvas(ticket, { scale: 2 }).then(canvas => {
        const link = document.createElement("a");
        link.download = "ticket.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
    });
});
</script>

</body>
</html>
