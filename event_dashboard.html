<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Analytics Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(120deg, #eaf1ff, #f7fbff);
      color: #1b3b6f;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #1b3b6f;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 a {
      color: white;
      text-decoration: none;
    }

    .dashboard-container {
      width: 85%;
      margin: 40px auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #1b3b6f;
    }

    select {
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 30px;
      width: 100%;
    }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .stat-card {
      background: #e9f1ff;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: scale(1.05);
    }

    .stat-card h3 {
      margin-bottom: 10px;
      color: #2b4b9a;
    }

    .stat-card p {
      font-size: 22px;
      font-weight: bold;
    }

    canvas {
      width: 100%;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <h2 class="companyname"><a href="mainpage.html">CampusEvents</a></h2>
  <nav class="navigation">
    <a href="create_events.html" style="color:white;">Create Event</a>
    <a href="event_dashboard.html" style="color:white;">Dashboard</a>
    <a href="logout.html" style="color:white;">Logout</a>
  </nav>
</header>

<div class="dashboard-container">
  <h1>Event Analytics Dashboard</h1>

  <label for="eventSelect"><strong>Select Event:</strong></label>
  <select id="eventSelect">
    <option selected disabled>Loading events...</option>
  </select>

  <div class="stat-cards">
    <div class="stat-card">
      <h3>Tickets Issued</h3>
      <p id="ticketsIssued">0</p>
    </div>
    <div class="stat-card">
      <h3>Attendance Rate</h3>
      <p id="attendanceRate">0%</p>
    </div>
    <div class="stat-card">
      <h3>Remaining Capacity</h3>
      <p id="remainingCapacity">0</p>
    </div>
  </div>

  <canvas id="eventChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  // Fetch all events from backend
  fetch("http://localhost:5000/api/events")
    .then(res => res.json())
    .then(events => {
      const select = document.getElementById("eventSelect");
      select.innerHTML = "";
      events.forEach(event => {
        const option = document.createElement("option");
        option.value = event.event_id;
        option.textContent = event.title;
        select.appendChild(option);
      });

      // Load stats when selecting an event
      select.addEventListener("change", () => {
        const selectedId = select.value;
        const event = events.find(e => e.event_id == selectedId);
        if (event) {
          const issued = event.tickets_sold || 0;
          const capacity = event.capacity;
          const attendance = event.attendance_count || 0;
          const remaining = capacity - issued;
          const attendanceRate = capacity > 0 ? ((attendance / capacity) * 100).toFixed(1) : 0;

          document.getElementById("ticketsIssued").innerText = issued;
          document.getElementById("attendanceRate").innerText = attendanceRate + "%";
          document.getElementById("remainingCapacity").innerText = remaining;

          updateChart(issued, remaining, attendance);
        }
      });
    })
    .catch(err => console.error("Error fetching events:", err));

  // Chart.js for nice visualization
  let chart;
  function updateChart(issued, remaining, attendance) {
    const ctx = document.getElementById("eventChart").getContext("2d");
    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: ["Tickets Issued", "Remaining", "Attendance"],
        datasets: [{
          data: [issued, remaining, attendance],
          backgroundColor: ["#2b4b9a", "#6fa8dc", "#92c47d"]
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: "bottom"
          }
        }
      }
    });
  }
</script>

</body>
</html>
