<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Events - CampusEvents</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<header>
  <h2 class="companyname">
    <a href="mainpage.html" style="color: inherit; text-decoration: none;">CampusEvents</a>
  </h2>
    <nav class="navigation">
    <a href="mainpage.html">Home</a>
    <a href="contact.html">Contact</a>
    <a href="calendar.html">My Calendar</a>
    <a href="register.html" class="signInButton">Sign Up</a>
    <a href="login.html" class="loginbutton">Log In</a>
  </nav>
</header>

<main>
  <div class="filter-bar">
    <label for="filterType">Filter by:</label>
    <select id="filterType">
      <option value="club">Club</option>
      <option value="price">Price</option>
      <option value="date">Date</option>
    </select>

    <label for="filterValue">Select:</label>
    <select id="filterValue"></select>
  </div>

  <div id="messageBox"></div>
  <div id="eventGrid" class="event-grid"></div>
</main>

<script src="scripts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mixitup@3/dist/mixitup.min.js"></script>

<script>
let events = [];
const eventGrid   = document.getElementById("eventGrid");
const filterType  = document.getElementById("filterType");
const filterValue = document.getElementById("filterValue");

function displayEvents(eventList) {
  eventGrid.innerHTML = "";

  eventList.forEach(e => {

    const cleanDate  = e.event_date?.split("T")[0] ?? e.event_date;
    const cleanPrice = Number(e.price).toFixed(2);
    const clubClass  = e.location_name.replace(/\s+/g,"");

    const imgSrc = (e.image && e.image !== "NULL")
      ? e.image
      : "https://via.placeholder.com/350x200?text=Event";

    const card = document.createElement("div");
    card.classList.add("event-card", "mix", clubClass);
    card.setAttribute("data-price", cleanPrice);
    card.setAttribute("data-date", cleanDate);
    card.setAttribute("data-club", clubClass);

    card.innerHTML = `
      <img src="${imgSrc}" alt="${e.title}">
      <h3>${e.title}</h3>
      <p><strong>Date:</strong> ${cleanDate}</p>
      <p><strong>Time:</strong> ${e.event_time}</p>
      <p><strong>Location:</strong> ${e.location_name}</p>
      <p>${e.description ?? ""}</p>

      <div class="event-footer">
        <span class="price">$${cleanPrice}</span>
        <button class="buy-button"
          onclick="buyEvent(${e.event_id})">Buy</button>
      </div>
    `;

    eventGrid.appendChild(card);
  });

  mixer.forceRefresh();
}

fetch("http://localhost:5000/api/events")
  .then(res => res.json())
  .then(data => {
    events = data;
    displayEvents(events);
    updateFilterOptions();
  });

const mixer = mixitup("#eventGrid", {
  selectors: { target: ".mix" },
  animation: { duration: 250 }
});

function updateFilterOptions() {
  filterValue.innerHTML = "";
  const type = filterType.value;
  let opts = [];

  if (type === "club") {
    opts = [...new Set(events.map(e => e.location_name))];
  }

  if (type === "price") {
    opts = [...new Set(events.map(e => Number(e.price).toFixed(2)))];
  }

  if (type === "date") {
    opts = [...new Set(events.map(e =>
      e.event_date.split("T")[0]
    ))];
  }

  filterValue.innerHTML = `<option value="all">All</option>`;

  opts.forEach(o => {
    const option = document.createElement("option");

    option.value =
      type === "club"
        ? "." + o.replace(/\s+/g, "")          
        : `[data-${type}='${o}']`;            

    option.textContent = o;
    filterValue.appendChild(option);
  });

  mixer.filter("all");
}


filterType.addEventListener("change", updateFilterOptions);
filterValue.addEventListener("change", () =>
  mixer.filter(filterValue.value === "all" ? "all" : filterValue.value)
);
</script>
<footer class="site-footer">
    <p>
      © CampusEvents2025 · 
      <a href="about.html">About</a> · 
      <a href="contactfoot.html">Contact</a> · 
      <a href="privacy.html">Privacy</a>
    </p>
</footer>
</body>
</html>
