<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Analytics Dashboard</title>
  <link rel="stylesheet" href="public/styles.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(120deg, #eaf1ff, #f7fbff);
      color: #1b3b6f;
      margin: 0;
      padding: 0;
    }

    header h2 a {
      color: white;
      text-decoration: none;
    }

    .dashboard-container {
      width: 85%;
      margin: 40px auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #1b3b6f;
    }

    select {
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 30px;
      width: 100%;
    }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .stat-card {
      background: #e9f1ff;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: scale(1.05);
    }

    .stat-card h3 {
      margin-bottom: 10px;
      color: #2b4b9a;
    }

    .stat-card p {
      font-size: 22px;
      font-weight: bold;
    }

    canvas {
      width: 100%;
      height: 100%;
      margin-top: 40px;
    }
    #eventChart {
  max-width: 350px !important;
  max-height: 350px !important;
  margin: 25px auto !important;
  display: block;
}

  </style>
</head>
<body>

<header>
  <h2 class="companyname">
    <a href="mainpage.html" style="color: inherit; text-decoration: none;">CampusEvents</a>
  </h2>
  <nav class="navigation">
    <a href="mainpage.html">Home</a>
    <a href="create_events.html" class="loginbutton">Create Event</a>
    <a href="event_dashboard.html">Dashboard</a>
    <a href="logout.html">Logout</a>
  </nav>
</header>

<div class="dashboard-container">
  <h1>Event Analytics Dashboard</h1>

  <label for="eventSelect"><strong>Select Event:</strong></label>
  <select id="eventSelect">
    <option selected disabled>Loading events...</option>
  </select>

  <div class="stat-cards">
    <div class="stat-card">
      <h3>Tickets Issued</h3>
      <p id="ticketsIssued">0</p>
    </div>
    <div class="stat-card">
      <h3>Attendance Rate</h3>
      <p id="attendanceRate">0%</p>
    </div>
    <div class="stat-card">
      <h3>Remaining Capacity</h3>
      <p id="remainingCapacity">0</p>
    </div>
  </div>
<button id="exportBtn" class="export-btn" disabled>⬇️ Export Analytics (CSV)</button>

  <canvas id="eventChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src = "scripts.js"></script>
<script>
document.getElementById('exportBtn').addEventListener('click', exportCSV);
let eventsData = []; 
let chart;

fetch('http://localhost:5000/api/event-analytics')
  .then(res => res.json())
  .then(events => {
    const select = document.getElementById('eventSelect');
    const issued = document.getElementById('ticketsIssued');
    const remaining = document.getElementById('remainingCapacity');
    const rate = document.getElementById('attendanceRate');
    const exportBtn = document.getElementById('exportBtn');

    eventsData = events; 
    select.innerHTML = '';

    
    events.forEach(ev => {
      const opt = document.createElement('option');
      opt.value = ev.event_id;
      opt.textContent = ev.title;
      select.appendChild(opt);
    });

    select.addEventListener('change', () => {
      const selected = events.find(e => e.event_id == select.value);
      if (selected) {
        const sold = selected.tickets_sold;
        const remain = selected.remaining_capacity;
        const capacity = selected.capacity;
        const attendanceRate = capacity > 0 ? ((sold / capacity) * 100).toFixed(1) + '%' : '0%';

        issued.textContent = sold;
        remaining.textContent = remain;
        rate.textContent = attendanceRate;

        updateChart(sold, remain, parseFloat(attendanceRate));
      }
    });

    exportBtn.disabled = false;

    if (events.length > 0) {
      select.selectedIndex = 0;
      select.dispatchEvent(new Event('change'));
    }
  })
  .catch(err => {
    console.error("Error loading events:", err);
    document.getElementById('eventSelect').innerHTML =
      '<option disabled>Error loading events</option>';
  });

function updateChart(issued, remaining, attendance) {
  const ctx = document.getElementById("eventChart").getContext("2d");
  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: ["Tickets Issued", "Remaining Capacity"],
      datasets: [{
        data: [issued, remaining],
        backgroundColor: ["#2b4b9a", "#6fa8dc"]
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: "bottom" }
      }
    }
  });
}

// EXPORT CSV 
function exportCSV() {
  const select = document.getElementById('eventSelect');
  const eventId = select.value;

  if (!eventId) {
    alert("⚠️ Please select an event first!");
    return;
  }

  const downloadUrl = `http://localhost:5000/export-csv/${eventId}`;
  const a = document.createElement("a");
  a.href = downloadUrl;
  a.download = `attendees_event_${eventId}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

</script>


</body>
</html>
