<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Calendar - CampusEvents</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h2 class="companyname">
    <a href="mainpage.html" style="color: inherit; text-decoration: none;">CampusEvents</a>
  </h2>
    <nav class="navigation">
    <a href="mainpage.html">Home</a>
    <a href="contact.html">Contact</a>
    <a href="calendar.html">My Calendar</a>
    <a href="register.html" class="signInButton">Sign Up</a>
    <a href="login.html" class="loginbutton">Log In</a>
  </nav>
</header>

<main>
    <div class="calendar-container">
        <div id="calendar"></div>
    </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');

    const events = JSON.parse(localStorage.getItem('userCalendar')) || [];

    const fcEvents = events.map(e => ({
        title: e.title,
        start: e.date + 'T' + e.time, 
        description:`${e.details} at ${e.location} - $${e.price}`
    }));

    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: fcEvents,
        eventClick: function(info) {
            alert(info.event.title + '\n' + info.event.extendedProps.description);
        }
    });

    calendar.render();
});
</script>
